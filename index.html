<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Khyrk Shan Gula | Web Developer &amp; Digital Creative</title>
    <meta
      name="description"
      content="Khyrk Shan Gula is a BS Information Systems student, web developer and social media graphic designer creating websites, graphics and short-form video."
    />
    <meta name="theme-color" content="#05070d" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before the page paints, so it never flashes the wrong colours.
      ;(function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('kh-theme')
          if (saved === 'light' || saved === 'white') theme = saved
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
        var bar = { dark: '#05070d', light: '#e9eef5', white: '#ffffff' }[theme]
        document.querySelector('meta[name="theme-color"]').setAttribute('content', bar)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
