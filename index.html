    <script>
      // Apply the saved theme before the page paints, so it never flashes the wrong colours.
      ;(function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('kh-theme')
          if (saved === 'light' || saved === 'white') theme = saved
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
        var bar = { dark: '#05070d', light: '#e9eef5', white: '#ffffff' }[theme]
        document.querySelector('meta[name="theme-color"]').setAttribute('content', bar)
      })()
    </script>
